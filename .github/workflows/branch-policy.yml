name: Branch policy
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions: {}
jobs:
  staging-to-main:
    name: staging-to-main
    runs-on: ubuntu-latest
    steps:
      - name: Require staging from this repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_BRANCH" != staging ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo 'Only staging from this repository may merge into main.' >&2
            exit 1
          fi
